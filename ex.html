<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة جامعة بني سويف</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0a1628 0%, #1a3a6b 50%, #0a1628 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  }

  .card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 40px 36px;
    width: 360px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    text-align: center;
  }

  .logo {
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #c8a028, #f0c040);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-size: 32px;
    box-shadow: 0 8px 24px rgba(200,160,40,0.4);
  }

  h1 {
    color: #fff;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 4px;
  }

  .sub {
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    margin-bottom: 32px;
  }

  .field {
    margin-bottom: 16px;
    text-align: right;
  }

  label {
    display: block;
    color: rgba(255,255,255,0.7);
    font-size: 13px;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 12px 16px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    color: #fff;
    font-size: 15px;
    outline: none;
    transition: border 0.2s, background 0.2s;
    text-align: right;
    direction: ltr;
  }

  input:focus {
    border-color: #c8a028;
    background: rgba(255,255,255,0.12);
  }

  input::placeholder { color: rgba(255,255,255,0.3); direction: rtl; }

  .btn {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    background: linear-gradient(135deg, #c8a028, #f0c040);
    border: none;
    border-radius: 12px;
    color: #0a1628;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 6px 20px rgba(200,160,40,0.35);
  }

  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(200,160,40,0.5); }
  .btn:active { transform: translateY(0); }

  .footer {
    margin-top: 24px;
    color: rgba(255,255,255,0.3);
    font-size: 11px;
  }

  /* hidden real form */
  #realForm { display: none; }

  .loading {
    display: none;
    margin-top: 12px;
    color: rgba(255,255,255,0.6);
    font-size: 13px;
  }
  .loading.show { display: block; }
  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #f0c040;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-left: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="card">
  <div class="logo">🎓</div>
  <h1>التسجيل الإلكتروني</h1>
  <p class="sub">جامعة بني سويف</p>

  <div class="field">
    <label>اسم المستخدم (الرقم القومي / كود الطالب)</label>
    <input type="text" id="username" placeholder="أدخل الكود هنا" autocomplete="username" />
  </div>

  <div class="field">
    <label>كلمة السر</label>
    <input type="password" id="password" placeholder="أدخل كلمة السر" autocomplete="current-password" />
  </div>

  <button class="btn" onclick="doLogin()">دخول ←</button>

  <div class="loading" id="loading">
    <span class="spinner"></span> جاري تسجيل الدخول...
  </div>

  <div class="footer">بوابة سريعة لنظام جامعة بني سويف</div>
</div>

<!-- النموذج الحقيقي المخفي -->
<form id="realForm"
  method="POST"
  action="https://www.mis.bsu.edu.eg/umisswf/Registration/ed_login.aspx"
  target="_self">
  <input type="hidden" name="__VIEWSTATE" id="vs" value="" />
  <input type="hidden" name="__VIEWSTATEGENERATOR" id="vsg" value="3639424D" />
  <input type="hidden" name="__EVENTVALIDATION" id="ev" value="" />
  <input type="text"   name="ctl00$cntphmaster$txt_StudCode"     id="f_user" />
  <input type="text"   name="ctl00$cntphmaster$txt_Nationalnum"  id="f_pass" />
  <input type="submit" name="ctl00$cntphmaster$btn_Login"        value="تسجيل دخول" />
</form>

<script>
// جلب الـ VIEWSTATE من صفحة اللوجين الأصلية وقت الضغط
async function doLogin() {
  const user = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value.trim();

  if (!user || !pass) {
    alert('من فضلك أدخل اسم المستخدم وكلمة السر');
    return;
  }

  document.getElementById('loading').classList.add('show');

  try {
    // جلب الصفحة الأصلية عشان ناخد الـ VIEWSTATE الصح
    const res = await fetch('https://www.mis.bsu.edu.eg/umisswf/Registration/ed_login.aspx', {
      credentials: 'include'
    });
    const html = await res.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');

    const vs  = doc.getElementById('__VIEWSTATE')?.value || '';
    const ev  = doc.getElementById('__EVENTVALIDATION')?.value || '';

    document.getElementById('vs').value  = vs;
    document.getElementById('ev').value  = ev;
    document.getElementById('f_user').value = user;
    document.getElementById('f_pass').value = pass;

    document.getElementById('realForm').submit();

  } catch(e) {
    // لو فشل الجلب (CORS) نبعت من غير VIEWSTATE محدث
    document.getElementById('f_user').value = user;
    document.getElementById('f_pass').value = pass;
    document.getElementById('realForm').submit();
  }
}

// دخول بـ Enter
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
</script>

</body>
</html>
