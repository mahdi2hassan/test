<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة جامعة بني سويف</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0a1628 0%, #1a3a6b 50%, #0a1628 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  }

  .card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 40px 36px;
    width: 360px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.4);
    text-align: center;
  }

  .logo {
    width: 80px; height: 80px;
    background: linear-gradient(135deg, #c8a028, #f0c040);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    font-size: 32px;
    box-shadow: 0 8px 24px rgba(200,160,40,0.4);
  }

  h1 { color: #fff; font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .sub { color: rgba(255,255,255,0.5); font-size: 13px; margin-bottom: 32px; }

  .field { margin-bottom: 16px; text-align: right; }

  label { display: block; color: rgba(255,255,255,0.7); font-size: 13px; margin-bottom: 6px; }

  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 12px 16px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    color: #fff;
    font-size: 15px;
    outline: none;
    transition: border 0.2s, background 0.2s;
    text-align: right;
  }

  input:focus { border-color: #c8a028; background: rgba(255,255,255,0.12); }
  input::placeholder { color: rgba(255,255,255,0.3); }

  .remember {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    cursor: pointer;
  }
  .remember input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }

  .btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #c8a028, #f0c040);
    border: none;
    border-radius: 12px;
    color: #0a1628;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 6px 20px rgba(200,160,40,0.35);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(200,160,40,0.5); }
  .btn:active { transform: translateY(0); }

  .hint {
    margin-top: 16px;
    padding: 12px;
    background: rgba(255,255,255,0.05);
    border-radius: 10px;
    color: rgba(255,255,255,0.45);
    font-size: 12px;
    line-height: 1.7;
    display: none;
  }
  .hint.show { display: block; }

  .step {
    margin-top: 8px;
    color: #f0c040;
    font-size: 13px;
    font-weight: 600;
    display: none;
  }
  .step.show { display: block; }

  .footer { margin-top: 24px; color: rgba(255,255,255,0.3); font-size: 11px; }
</style>
</head>
<body>

<div class="card">
  <div class="logo">🎓</div>
  <h1>التسجيل الإلكتروني</h1>
  <p class="sub">جامعة بني سويف</p>

  <div class="field">
    <label>اسم المستخدم (الرقم القومي / كود الطالب)</label>
    <input type="text" id="username" placeholder="أدخل الكود هنا" autocomplete="username" />
  </div>

  <div class="field">
    <label>كلمة السر</label>
    <input type="password" id="password" placeholder="أدخل كلمة السر" autocomplete="current-password" />
  </div>

  <label class="remember">
    <input type="checkbox" id="rememberMe" /> حفظ البيانات للمرة الجاية
  </label>

  <button class="btn" onclick="doLogin()">دخول ←</button>

  <p class="step" id="step">⏳ جاري فتح النظام... أدخل بياناتك في الصفحة اللي هتفتح</p>
  <div class="hint" id="hint">
    ⚠️ بسبب قيود أمان سيرفر الجامعة، مش ممكن نعمل تسجيل دخول مباشر.<br>
    هتفتح صفحة الجامعة — بياناتك اتنسخت في الـ clipboard.<br>
    بس الصقها في الحقول وادخل.
  </div>

  <div class="footer">بوابة سريعة لنظام جامعة بني سويف</div>
</div>

<script>
const TARGET = 'https://www.mis.bsu.edu.eg/umisswf/Registration/ed_login.aspx';

// تحميل البيانات المحفوظة
window.onload = () => {
  const saved = localStorage.getItem('bsu_creds');
  if (saved) {
    try {
      const { u, p } = JSON.parse(saved);
      document.getElementById('username').value = u || '';
      document.getElementById('password').value = p || '';
      document.getElementById('rememberMe').checked = true;
    } catch(e) {}
  }
};

function doLogin() {
  const user = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value.trim();
  const remember = document.getElementById('rememberMe').checked;

  if (!user || !pass) {
    alert('من فضلك أدخل اسم المستخدم وكلمة السر');
    return;
  }

  // حفظ أو مسح البيانات
  if (remember) {
    localStorage.setItem('bsu_creds', JSON.stringify({ u: user, p: pass }));
  } else {
    localStorage.removeItem('bsu_creds');
  }

  // نسخ الكود ثم كلمة السر للـ clipboard
  const combined = `الكود: ${user}\nكلمة السر: ${pass}`;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(combined).catch(() => {});
  }

  document.getElementById('step').classList.add('show');

  // فتح صفحة الجامعة بعد ثانية
  setTimeout(() => {
    window.location.href = TARGET;
  }, 1000);
}

// دخول بـ Enter
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
</script>

</body>
</html>
