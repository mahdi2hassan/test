<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة جامعة بني سويف</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #0a1628 0%, #1a3a6b 60%, #0a1628 100%);
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    padding: 24px 16px 40px;
  }

  /* HEADER */
  .header {
    text-align: center;
    margin-bottom: 28px;
  }

  .logo {
    width: 72px; height: 72px;
    background: linear-gradient(135deg, #c8a028, #f0c040);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 12px;
    font-size: 28px;
    box-shadow: 0 8px 24px rgba(200,160,40,0.4);
  }

  h1 { color: #fff; font-size: 20px; font-weight: 700; }
  .sub { color: rgba(255,255,255,0.45); font-size: 13px; margin-top: 4px; }

  /* LOGIN SECTION */
  .login-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 24px;
    backdrop-filter: blur(16px);
  }

  .login-title {
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    margin-bottom: 12px;
    text-align: center;
    letter-spacing: 0.5px;
  }

  .inputs { display: flex; flex-direction: column; gap: 10px; }

  input[type="text"], input[type="password"] {
    width: 100%;
    padding: 11px 14px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.13);
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: border 0.2s;
    text-align: right;
  }
  input:focus { border-color: #c8a028; }
  input::placeholder { color: rgba(255,255,255,0.28); }

  .remember {
    display: flex; align-items: center; gap: 8px;
    color: rgba(255,255,255,0.5); font-size: 12px;
    cursor: pointer; margin-top: 4px;
  }
  .remember input { width: auto; }

  .btn-login {
    width: 100%; padding: 12px;
    background: linear-gradient(135deg, #c8a028, #f0c040);
    border: none; border-radius: 10px;
    color: #0a1628; font-size: 15px; font-weight: 700;
    cursor: pointer; margin-top: 10px;
    transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 5px 18px rgba(200,160,40,0.35);
  }
  .btn-login:hover { transform: translateY(-1px); }
  .btn-login:active { transform: translateY(0); }

  /* STATUS */
  .status {
    text-align: center; font-size: 12px; margin-top: 8px; min-height: 18px;
    color: rgba(255,255,255,0.4);
  }
  .status.ok { color: #4ade80; }
  .status.err { color: #f87171; }

  /* SHORTCUTS */
  .section-title {
    color: rgba(255,255,255,0.4);
    font-size: 11px;
    letter-spacing: 1px;
    margin-bottom: 12px;
    text-align: center;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 18px 14px;
    text-decoration: none;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    transition: background 0.2s, transform 0.15s, border-color 0.2s;
    cursor: pointer;
    backdrop-filter: blur(12px);
  }
  .card:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); border-color: rgba(200,160,40,0.4); }
  .card:active { transform: translateY(0); }

  .icon {
    width: 48px; height: 48px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }

  .card-label {
    color: #fff; font-size: 13px; font-weight: 600;
    text-align: center; line-height: 1.4;
  }

  /* icon colors */
  .ic-blue   { background: rgba(59,130,246,0.2); }
  .ic-green  { background: rgba(34,197,94,0.2); }
  .ic-yellow { background: rgba(234,179,8,0.2); }
  .ic-purple { background: rgba(168,85,247,0.2); }
  .ic-red    { background: rgba(239,68,68,0.2); }

  /* FOOTER */
  .footer {
    text-align: center; color: rgba(255,255,255,0.2);
    font-size: 11px; margin-top: 28px;
  }

  /* hidden real form */
  #realForm { display: none; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">🎓</div>
  <h1>التسجيل الإلكتروني</h1>
  <p class="sub">جامعة بني سويف</p>
</div>

<!-- LOGIN -->
<div class="login-card">
  <p class="login-title">تسجيل الدخول أولاً للوصول للخدمات</p>
  <div class="inputs">
    <input type="text"     id="username" placeholder="اسم المستخدم / الرقم القومي" autocomplete="username" />
    <input type="password" id="password" placeholder="كلمة السر" autocomplete="current-password" />
  </div>
  <label class="remember">
    <input type="checkbox" id="rememberMe" /> تذكر بياناتي
  </label>
  <button class="btn-login" onclick="doLogin()">دخول ←</button>
  <div class="status" id="status"></div>
</div>

<!-- SHORTCUTS -->
<p class="section-title">الخدمات المتاحة — اضغط للدخول المباشر</p>

<div class="grid">

  <div class="card" onclick="go('https://www.mis.bsu.edu.eg/umisswf/Registration/ED/STUDENTSUBJECTS.ASPX')">
    <div class="icon ic-blue">📋</div>
    <span class="card-label">بيان المقررات</span>
  </div>

  <div class="card" onclick="go('https://www.mis.bsu.edu.eg/umisswf/Registration/ED/OR_Stud_EXPENSES.aspx')">
    <div class="icon ic-green">💰</div>
    <span class="card-label">المصروفات</span>
  </div>

  <div class="card" onclick="go('https://www.mis.bsu.edu.eg/umisswf/Registration/ED/OR_RS_ST_223.aspx')">
    <div class="icon ic-yellow">🪪</div>
    <span class="card-label">بطاقة التسجيل</span>
  </div>

  <div class="card" onclick="go('https://www.mis.bsu.edu.eg/umisswf/Registration/ED/OR_REG_COURSE_GROUP.aspx')">
    <div class="icon ic-purple">📚</div>
    <span class="card-label">السجل الدراسي</span>
  </div>

  <div class="card" style="grid-column: span 2;" onclick="go('https://www.mis.bsu.edu.eg/umisswf/Registration/ED/OR_RecordStudentPrimarySubjectsCredit.aspx')">
    <div class="icon ic-red">✏️</div>
    <span class="card-label">تسجيل المواد</span>
  </div>

  <div class="card" style="grid-column: span 2;" onclick="go('https://www.mis.bsu.edu.eg/umisswf/Registration/ed_login.aspx')">
    <div class="icon" style="background:rgba(255,255,255,0.08)">🔐</div>
    <span class="card-label" style="color:rgba(255,255,255,0.5)">صفحة الدخول الرسمية</span>
  </div>

</div>

<div class="footer">جامعة بني سويف — نظام MIS</div>

<!-- Real Form -->
<form id="realForm" method="POST"
  action="https://www.mis.bsu.edu.eg/umisswf/Registration/ed_login.aspx"
  target="_self">
  <input type="hidden" name="__VIEWSTATE"          id="vs"  value="wEPDwUKLTM0NDAzNDI3Ng9k" />
  <input type="hidden" name="__VIEWSTATEGENERATOR" id="vsg" value="3639424D" />
  <input type="hidden" name="__EVENTVALIDATION"    id="ev"  value="wEWBwL07YmMCg" />
  <input type="text"   name="ctl00$cntphmaster$txt_StudCode"    id="f_user" />
  <input type="text"   name="ctl00$cntphmaster$txt_Nationalnum" id="f_pass" />
  <input type="submit" name="ctl00$cntphmaster$btn_Login"       value="تسجيل دخول" />
</form>

<script>
const LOGIN_URL = 'https://www.mis.bsu.edu.eg/umisswf/Registration/ed_login.aspx';

// تحميل البيانات المحفوظة
window.onload = () => {
  const saved = localStorage.getItem('bsu_creds');
  if (saved) {
    try {
      const { u, p } = JSON.parse(saved);
      document.getElementById('username').value = u || '';
      document.getElementById('password').value = p || '';
      document.getElementById('rememberMe').checked = true;
    } catch(e) {}
  }
};

function setStatus(msg, type='') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + type;
}

async function doLogin() {
  const user = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value.trim();
  const remember = document.getElementById('rememberMe').checked;

  if (!user || !pass) { setStatus('أدخل اسم المستخدم وكلمة السر', 'err'); return; }

  if (remember) {
    localStorage.setItem('bsu_creds', JSON.stringify({ u: user, p: pass }));
  } else {
    localStorage.removeItem('bsu_creds');
  }

  setStatus('⏳ جاري تسجيل الدخول...');

  document.getElementById('f_user').value = user;
  document.getElementById('f_pass').value = pass;
  document.getElementById('realForm').submit();
}

// الضغط على Enter
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

// الدخول المباشر للصفحات (بعد تسجيل الدخول)
function go(url) {
  const user = document.getElementById('username').value.trim();
  const pass = document.getElementById('password').value.trim();

  if (!user || !pass) {
    setStatus('⚠️ سجّل دخولك الأول', 'err');
    document.getElementById('username').focus();
    return;
  }
  // حفظ الـ URL المطلوب ثم تسجيل الدخول
  sessionStorage.setItem('bsu_redirect', url);
  document.getElementById('f_user').value = user;
  document.getElementById('f_pass').value = pass;
  document.getElementById('realForm').action = url; // نحاول مباشرة
  document.getElementById('realForm').submit();
}
</script>

</body>
</html>
